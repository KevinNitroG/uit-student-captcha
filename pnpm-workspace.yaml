packages:
  - packages/*

# Single source of truth for dependency versions. Every package.json references these
# with `catalog:` instead of a literal range, so versions are bumped in exactly one
# place. Workspace-internal deps stay `workspace:*` (not catalogued).
catalog:
  "@nx/js": 22.7.5
  "@nx/vite": 22.7.5
  "@nx/vitest": 22.7.5
  "@tailwindcss/vite": ^4.3.0
  "@testing-library/dom": ^10.4.0
  "@testing-library/react": ^16.3.0
  "@types/node": ^24.0.0
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0
  "@typescript/native-preview": 7.0.0-dev.20260610.1
  "@vitejs/plugin-react": ^6.0.2
  "@vitest/coverage-v8": ^4.1.8
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  jsdom: ^29.1.1
  lucide-react: ^1.17.0
  nx: 22.7.5
  radix-ui: ^1.5.0
  react: ^19.2.0
  react-dom: ^19.2.0
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.0
  tw-animate-css: ^1.4.0
  typescript: ^6.0.3
  vite: ^8.0.11
  vite-plugin-monkey: ^8.0.6
  vitest: ^4.1.8

allowBuilds:
  esbuild: true
  nx: true
