name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Baked into both bundles at build time via Vite (`import.meta.env` in source,
# `loadEnv()` in the two vite.config.ts files). Drives the config-page origin used
# for the userscript @match/@connect, the menu-command URL, and the postMessage
# bridge origin check. Locally this defaults to http://localhost:3000; in CI we
# pin the deployed GitHub Pages origin so the released artifacts target production.
env:
  VITE_CONFIG_PAGE_ORIGIN: https://kevinnitrog.github.io/uit-student-captcha
  MISE_OVERRIDE_CONFIG_FILENAMES: .mise.ci.toml

jobs:
  check:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@v4

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true
          version: ^11

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Setup Mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          cache: true

      - name: Derive SHAs for Nx Affected
        id: set-shas
        uses: nrwl/nx-set-shas@v5

      - run: pnpm install

      - name: Typecheck, test, and build all projects
        run: |
          nx-cache-action -- \
          nx run-many \
          -t typecheck \
          -t test \
          -t build

  # release-please maintains a single "Release PR" off main, driven by Conventional
  # Commits. Both packages share ONE version and ONE `v{version}` tag (root component,
  # `include-component-in-tag: false`); the resolved version is committed into the root
  # and userscript package.json (via the config's `extra-files`) so Vite can bake it
  # into the userscript header. Merging the Release PR is what cuts the tag + GitHub
  # Release; `release_created` then gates the publish job below.
  release-please:
    name: Release Please
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create release + tag, push the release PR branch
      pull-requests: write # open/update the Release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs only on the push that merges the Release PR (release_created == true). At that
  # point main HEAD already carries the bumped version in package.json, so the build
  # bakes the correct userscript header. We attach the .user.js to the freshly created
  # release and deploy the config page to GitHub Pages in the same job (a release made
  # with GITHUB_TOKEN does not fire the `release` event, so we chain the deploy inline).
  publish:
    name: Publish Asset · Deploy Config Page
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the userscript release asset
      pages: write # deploy config page to GitHub Pages
      id-token: write # OIDC for actions/deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@v4

      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true
          version: ^11

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Setup Mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          cache: true

      - run: pnpm install --frozen-lockfile

      # Both projects emit to {workspaceRoot}/dist/{projectName} (see vite.config.ts):
      #   dist/uit-student-captcha/uit-student-captcha.user.js  — the userscript asset
      #   dist/uit-student-captcha-config-page/                 — the config page
      - name: Build with the released version baked in
        run: |
          nx-cache-action -- \
          nx run-many -t build

      - name: Attach userscript asset to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: dist/uit-student-captcha/uit-student-captcha.user.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/uit-student-captcha-config-page

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
